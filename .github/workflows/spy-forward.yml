name: SPY forward ledger

on:
  schedule:
    - cron: '53 9 * * 1-5'
      timezone: America/New_York
    - cron: '27 10,13,16,17,20 * * 1-5'
      timezone: America/New_York
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spy-forward-ledger
  cancel-in-progress: false

jobs:
  record:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: forward-data
          path: .forward-data
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-forward.txt
      - run: python -m pip install -r scripts/requirements-forward.txt
      - run: python -m unittest discover -s tests -p 'test_spy_forward.py' -v
      - name: Observe regular-session SPY data
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          cp .forward-data/ledger.json "$RUNNER_TEMP/previous.json"
          options=()
          if [[ "$MANUAL" == true ]]; then options+=(--probe); fi
          python scripts/spy_forward.py .forward-data/ledger.json "${options[@]}"
      - name: Publish new receipts
        working-directory: .forward-data
        run: |
          if git diff --quiet -- ledger.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ledger.json
          git commit -m "Record SPY forward observations for run $GITHUB_RUN_ID"
          python ../scripts/spy_forward.py ledger.json --before-push "$RUNNER_TEMP/previous.json"
          git push origin HEAD:refs/heads/forward-data
